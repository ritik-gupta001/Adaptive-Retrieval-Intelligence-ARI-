# SSE requires special nginx config:
#   - proxy_buffering off  → don't buffer streaming responses
#   - proxy_read_timeout   → long timeout for slow graph runs (120s covers retry loops)
#   - X-Accel-Buffering: no is set by stream.py already, this reinforces it

server {
    listen 80;
    server_name _;

    # Gzip for static assets (not SSE — compressing a stream is pointless)
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # ── Frontend static files ────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache HTML briefly so deploys propagate; assets can be cached longer
        # (no versioned filenames here since it's a single index.html)
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API proxy (standard JSON endpoints) ─────────────────────────────────
    location /query {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── SSE streaming proxy ──────────────────────────────────────────────────
    location /query/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE: disable all buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;

        # Required headers for SSE to work through nginx
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # ── Health and graph structure endpoints ─────────────────────────────────
    location ~ ^/(health|graph)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
